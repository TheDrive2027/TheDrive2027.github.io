<!DOCTYPE html>

            </ul>
        </nav>

        <!-- MAIN CONTENT AREA -->
        <div class="main-area">
            <!-- TOP BAR -->
            <header class="site-header">
                <div class="header-inner">
                    <div class="logo-text">CINEMATHEQUE</div>
                    <div class="header-center">
                        <div class="search-wrap">
                            <span class="search-icon">⌕</span>
                            <input type="text" id="search-input" placeholder="Search local library...">
                            <button class="clear-search" id="clear-search">×</button>
                        </div>
                    </div>
                    <div class="header-meta">
                        <div class="online-wrap">
                            <span class="online-dot"></span>
                            <span id="server-status">Connecting...</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- DYNAMIC VIEW CONTAINER -->
            <main class="main-content" id="content-area">
                <!-- Views injected by JS -->
            </main>
        </div>
    </div>

    <!-- VIDEO PLAYER MODAL -->
    <div class="modal-overlay hidden" id="video-modal" style="background: rgba(0,0,0,0.95);">
        <div class="modal-box" style="max-width: 960px; padding: 0; background: #000; border: none; box-shadow: none;">
            <button id="close-modal" style="position: absolute; top: 16px; right: 16px; z-index: 10; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 16px;">✕</button>
            <video id="modal-video-player" controls style="width: 100%; max-height: 80vh; display: block;"></video>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
